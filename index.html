
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayOrbit Admin</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d18;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login {
      width: min(90%, 380px);
      padding: 30px;
      background: #111b2d;
      border: 1px solid #263650;
      border-radius: 18px;
    }

    h1 { margin-top: 0; }
    p { color: #9eacc2; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      color: white;
      background: #080d18;
      border: 1px solid #34445d;
    }

    button {
      border: 0;
      background: #6d8cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message { font-size: 13px; }
  </style>
</head>

<body>
  <div class="login">
    <h1>PayOrbit Admin</h1>
    <p>Secure administrator access</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Admin email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>
    </form>

    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      loginButton.disabled = true;
      message.textContent = "Checking admin access...";

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          });

        if (error) throw error;

        const { data: role, error: roleError } =
          await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", data.user.id)
            .maybeSingle();

        if (roleError) throw roleError;

        if (!role) {
          await supabaseClient.auth.signOut();
          throw new Error("Access denied. Admin account only.");
        }

        message.textContent = "Admin login successful! Redirecting...";

        window.location.replace("dashboard.html");

      } catch (error) {
        message.textContent = error.message;
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
