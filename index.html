
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayOrbit Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d18;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .login {
      width: min(90%, 380px);
      padding: 30px;
      background: #111b2d;
      border: 1px solid #263650;
      border-radius: 18px;
    }
    h1 { margin-top: 0; }
    p { color: #9eacc2; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: 15px;
    }
    input {
      color: white;
      background: #080d18;
      border: 1px solid #34445d;
    }
    button {
      border: 0;
      background: #6d8cff;
      color: white;
      font-weight: bold;
    }
    #message { font-size: 13px; }
  </style>
</head>
<body>
  <div class="login">
    <h1>PayOrbit Admin</h1>
    <p>Secure administrator access</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
    <p id="message"></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</body>
</html>
